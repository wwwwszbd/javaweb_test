<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <style>
    .el-table .warning-row {
      background: oldlace;
    }

    .el-table .success-row {
      background: #f0f9eb;
    }
  </style>

</head>
<body>
<div id="app">

  <!--搜索表单-->
  <el-form :inline="true" :model="brand" class="demo-form-inline">

    <el-form-item label="当前状态">
      <el-select v-model="brand.status" placeholder="当前状态">
        <el-option label="启用" value="1"></el-option>
        <el-option label="禁用" value="0"></el-option>
      </el-select>
    </el-form-item>

    <el-form-item label="企业名称">
      <el-input v-model="brand.companyName" placeholder="企业名称"></el-input>
    </el-form-item>

    <el-form-item label="品牌名称">
      <el-input v-model="brand.brandName" placeholder="品牌名称"></el-input>
    </el-form-item>

    <el-form-item>
      <el-button type="primary" @click="onSubmit">查询</el-button>
    </el-form-item>
  </el-form>

  <!--按钮-->

  <el-row>

    <el-button type="danger" plain @click="deleteByIds">批量删除</el-button>
    <el-button type="primary" plain @click="dialogVisible = true">新增</el-button>

  </el-row>
  <!--添加数据对话框表单-->
  <el-dialog
          title="新增品牌"
          :visible.sync="dialogVisible"
          width="30%"
  >

    <el-form ref="form" :model="brand" label-width="80px">
      <el-form-item label="品牌名称">
        <el-input v-model="brand.brandName"></el-input>
      </el-form-item>

      <el-form-item label="企业名称">
        <el-input v-model="brand.companyName"></el-input>
      </el-form-item>

      <el-form-item label="排序">
        <el-input v-model="brand.ordered"></el-input>
      </el-form-item>

      <el-form-item label="备注">
        <el-input type="textarea" v-model="brand.description"></el-input>
      </el-form-item>

      <el-form-item label="状态">
        <el-switch v-model="brand.status"
                   active-value="1"
                   inactive-value="0"
        ></el-switch>
      </el-form-item>


      <el-form-item>
        <el-button type="primary" @click="addBrand">提交</el-button>
        <el-button @click="dialogVisible = false">取消</el-button>
      </el-form-item>
    </el-form>

  </el-dialog>

  <!--update表单-->
  <el-dialog
          title="修改品牌"
          :visible.sync="updateDialogVisible"
          width="30%"
  >

    <el-form ref="form" :model="brand" label-width="80px">
      <el-input v-model="brand.id" type="hidden"></el-input>
      <el-form-item label="品牌名称">
        <el-input v-model="brand.brandName"></el-input>
      </el-form-item>

      <el-form-item label="企业名称">
        <el-input v-model="brand.companyName"></el-input>
      </el-form-item>

      <el-form-item label="排序">
        <el-input v-model="brand.ordered"></el-input>
      </el-form-item>

      <el-form-item label="备注">
        <el-input type="textarea" v-model="brand.description"></el-input>
      </el-form-item>

      <el-form-item label="状态">
        <el-switch v-model="brand.status"
                   active-value="1"
                   inactive-value="0"
        ></el-switch>
      </el-form-item>

      <el-form-item>
        <el-button type="primary" @click="updateBrand">提交</el-button>
        <el-button @click="updateDialogVisible = false">取消</el-button>
      </el-form-item>
    </el-form>

  </el-dialog>

  <!--表格-->
  <template>
    <el-table
            :data="tableData"
            style="width: 100%"
            :row-class-name="tableRowClassName"
            @selection-change="handleSelectionChange"
    >
      <el-table-column
              type="selection"
              width="55">
      </el-table-column>
      <el-table-column
              type="index"
              width="50">
      </el-table-column>

      <el-table-column
              prop="brandName"
              label="品牌名称"
              align="center"
      >
      </el-table-column>
      <el-table-column
              prop="companyName"
              label="企业名称"
              align="center"
      >
      </el-table-column>
      <el-table-column
              prop="ordered"
              align="center"
              label="排序">
      </el-table-column>
      <el-table-column
              prop="status"
              align="center"
              label="当前状态">
      </el-table-column>

      <el-table-column
              align="center"
              label="操作">
        <template slot-scope="scope">
          <el-row>
            <el-button type="primary" @click=startUpdate(scope.row)>修改</el-button>
            <el-button type="danger" @click="open(scope.row)">删除</el-button>
          </el-row>
        </template>

      </el-table-column>

    </el-table>
  </template>

  <!--分页工具条-->
  <el-pagination
          @size-change="handleSizeChange"
          @current-change="handleCurrentChange"
          :current-page="currentPage"
          :page-sizes="[5, 10, 15, 20]"
          :page-size="5"
          layout="total, sizes, prev, pager, next, jumper"
          :total="totalCount"
          background
          layout="prev, pager, next"
          :total="100">
  </el-pagination>

</div>


<script src="js/vue.js"></script>
<script src="element-ui/lib/index.js"></script>
<link rel="stylesheet" href="element-ui/lib/theme-chalk/index.css">
<script src="js/axios-0.18.0.js"></script>
<script>
  new Vue({
    el: "#app",

    mounted() {
      //调用selectAll方法直接使用
      this.selectAll();
    },
    methods: {
      selectAll() {
        //var _this = this;//提生命周期
        axios({
          method: "post",
          url: "http://localhost:8080/brand-case/brand/selectByPageAndCondition?currentPage=" + this.currentPage + "&pageSize=" + this.pageSize + "",
          data: this.brand,
        }).then(resp => {  //新特性，然后就可以在then里面的下划线say no了
          this.tableData = resp.data.rows;//此时{rows:[],totalCount:[]}
          this.totalCount = resp.data.totalCount;
        })
      },
      tableRowClassName({row, rowIndex}) {
        if (rowIndex === 1) {
          return 'warning-row';
        } else if (rowIndex === 3) {
          return 'success-row';
        }
        return '';
      },
      // 复选框选中后执行的方法
      handleSelectionChange(val) {
        this.multipleSelection = val;

        console.log(this.multipleSelection)
      },
      // 添加数据
      addBrand() {
        //console.log(this.brand);
        //发送Ajax请求，发送json数据
        //var _this = this;
        axios({
          method: "post",
          url: "http://localhost:8080/brand-case/brand/add",
          data: this.brand
        }).then(resp => {
          if (resp.data == "success") {
            //录入成功，关闭窗口,并且重新查询数据
            this.dialogVisible = false;
            this.selectAll();
            this.$message({
              message: '成功添加一条数据',
              type: 'success'
            });
          }
        })
      },
      // 修改数据
      updateBrand() {
        //console.log(this.brand);可以获取完整数据
        //发送Ajax请求，发送json数据
        //var _this = this;
        axios({
          method: "post",
          url: "http://localhost:8080/brand-case/brand/update",
          data: this.brand
        }).then(resp => {
          if (resp.data == "success") {
            //录入成功，关闭窗口,并且重新查询数据
            this.updateDialogVisible = false;
            this.selectAll();
            this.$message({
              message: '成功添加一条数据',
              type: 'success'
            });
          }
        })
      },
      //执行修改的onclick
      startUpdate(row) {
        // 获取改行已经有的数据，以供填入修改框
        // var _this = this
        this.brand = JSON.parse(JSON.stringify(row));
        // 弹出修改框
        this.updateDialogVisible = true;
      },
      //打开删除的提示框，并根据提示进行操作
      open(row) {
        this.brand = JSON.parse(JSON.stringify(row));
        //var _this = this;
        this.$confirm('此操作将永久删除该文件, 是否继续?', '提示', {
          confirmButtonText: '确定',
          cancelButtonText: '取消',
          type: 'warning'
        }).then(() => {  //确认之后执行axios请求
          axios({
            method: "post",
            url: "http://localhost:8080/brand-case/brand/deleteById",
            data: this.brand
          }).then(resp => {
            if (resp.data == "success") {
              //录入成功，关闭窗口,并且重新查询数据
              this.selectAll();
              this.$message({
                message: '删除成功',
                type: 'success'
              });
            }
          })

        }).catch(() => { //取消之后执行标签
          this.$message({
            type: 'info',
            message: '已取消删除'
          });
        });
      },
      //批量删除的单击事件
      deleteByIds() {
        //console.log(this.multipleSelection);
        //1.创建id数组[1,2,3],从multipleSelection模型里面来的数据
        for (let i = 0; i < this.multipleSelection.length; i++) {
          let element = this.multipleSelection[i];
          //获取遍历后得到id值
          this.selectByIds[i] = element.id;
        }
        //var _this = this;
        this.$confirm('此操作将永久删除该文件, 是否继续?', '提示', {
          confirmButtonText: '确定',
          cancelButtonText: '取消',
          type: 'warning'
        }).then(() => {
          axios({
            method: "post",
            url: "http://localhost:8080/brand-case/brand/deleteByIds",
            data: this.selectByIds
          }).then(resp => {
            if (resp.data == "success") {
              //录入成功，关闭窗口,并且重新查询数据
              this.selectAll();
              this.$message({
                message: '成功删除数据',
                type: 'success'
              });
            }else{
              this.$message({
                message: '没有数据可以删除',
                type: 'info'
              });
            }
          })
        }).catch(() => {
          this.$message({
            type: 'info',
            message: '已取消删除'
          });
        });

      },
      //
      // 查询方法
      onSubmit() {
        //console.log(this.brand);
        this.selectAll();
      },
      //每页显示条数
      handleSizeChange(val) {
        //console.log(`每页 ${val} 条`);
        //重新设置当每页显示的条数
        this.pageSize = val;
        this.selectAll();
      },
      //当前页码
      handleCurrentChange(val) {
        //console.log(`当前页: ${val}`);
        //重新去设置当前页码，动态改变
        this.currentPage = val;
        this.selectAll();
      }

    },
    data() {
      return {
        pageSize: 5,
        //页码的总记录数
        totalCount: 100,
        // 当前页码
        currentPage: 1,
        // 添加数据对话框是否展示的标记
        dialogVisible: false,
        updateDialogVisible: false,
        // 品牌模型数据
        brand: {
          status: '',
          brandName: '',
          companyName: '',
          id: '',
          ordered: "",
          description: ""
        },
        //被选中的id数组
        selectByIds: [],
        // 复选框选中数据集合
        multipleSelection: [],
        // 表格数据
        tableData: [{
          brandName: '华为',
          companyName: '华为科技有限公司',
          ordered: '100',
          status: "1"
        }, {
          brandName: '华为',
          companyName: '华为科技有限公司',
          ordered: '100',
          status: "1"
        }, {
          brandName: '华为',
          companyName: '华为科技有限公司',
          ordered: '100',
          status: "1"
        }, {
          brandName: '华为',
          companyName: '华为科技有限公司',
          ordered: '100',
          status: "1"
        }]
      }
    }
  })

</script>

</body>
</html>
